interface:
  display_name: "Scientific Figure Making"
  short_description: "Normalize and verify research data, lead with style confirmation, then render and visually validate publication-ready Matplotlib figures."
  brand_color: "#0F4D92"
  default_prompt: "Use this skill to turn my pasted data, CSV/JSON/TeX table, table screenshot, reference image, or existing plot into a publication-ready figure. Normalize primary data and record provenance internally, then lead the user-facing response with a reference-first Style Brief. Ask unresolved style questions before data and scientific clarifications. Do not formally render until data fidelity, style/chart, and scientific semantics are verified or explicitly delegated. Then create Figure Spec 1.2, render tightly cropped PNG/PDF, inspect the original/grayscale preview, resolve outer-whitespace warnings, and revise composition, hierarchy, legibility, and accessibility defects."

policy:
  allow_implicit_invocation: true

metadata:
  version: "0.9.0"
  install_scope: "repo,user,admin"
  standalone: true
  design_layers:
    - style_intake
    - data_intake
    - guided_workflow
    - palette
    - chart_style
    - table_style
    - font
    - export_qa

dependencies:
  python: ">=3.9"
  packages:
    - matplotlib
    - numpy
