interface:
  display_name: "Scientific Figure Making"
  short_description: "Lead with style confirmation, then resolve scientific meaning, render, and visually validate publication-ready Matplotlib figures."
  brand_color: "#0F4D92"
  default_prompt: "Use this skill to turn my experiment data, reference image, or existing plot into a publication-ready figure. Start with a reference-first Style Brief; ask every unresolved venue, chart/grammar, palette, typography, and layout question before scientific clarifications in the same batch. Do not formally render until style, chart, and scientific semantics are confirmed or explicitly delegated. Then create Figure Spec 1.1, render PNG/PDF, inspect the original/grayscale preview, and revise defects."

policy:
  allow_implicit_invocation: true

metadata:
  version: "0.7.0"
  install_scope: "repo,user,admin"
  standalone: true
  design_layers:
    - style_intake
    - guided_workflow
    - palette
    - chart_style
    - table_style
    - font
    - export_qa

dependencies:
  python: ">=3.9"
  packages:
    - matplotlib
    - numpy
