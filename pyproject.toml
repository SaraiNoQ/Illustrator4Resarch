[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "illustrator4resarch"
version = "0.6.0"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.7", "numpy>=1.23"]

[tool.setuptools]
packages = ["scientific_figure_skill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
